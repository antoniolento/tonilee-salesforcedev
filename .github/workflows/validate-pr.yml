name: Validate Pull Request

on:
  pull_request:
    branches:
      - master
      - svil
      - bfx

jobs:
  validate:
    name: Validate Metadata Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Authenticate to Salesforce
        run: |
          echo "${{ secrets.SFDX_AUTH_URL }}" > authFile.json
          sf org login sfdx-url --sfdx-url-file authFile.json --alias target-org --set-default
        env:
          SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL }}

      - name: Validate Deploy (Check Only)
        run: |
          sf project deploy validate \
            --manifest manifests/package.xml \
            --target-org target-org \
            --test-level RunLocalTests \
            --coverage-formatters json \
            --results-dir test-results

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
