name: Deploy to Production

on:
  push:
    branches:
      - master

jobs:
  deploy:
    name: Deploy to Production Org
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Authenticate to Salesforce (Production)
        run: |
          echo "${{ secrets.SFDX_AUTH_URL }}" > authFile.json
          sf org login sfdx-url --sfdx-url-file authFile.json --alias prod-org --set-default
        env:
          SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL }}

      - name: Deploy to Production
        run: |
          sf project deploy start \
            --manifest manifests/package.xml \
            --target-org prod-org \
            --test-level RunLocalTests \
            --verbose

      - name: Notify on Success
        if: success()
        run: echo "Deploy in produzione completato con successo."

      - name: Notify on Failure
        if: failure()
        run: echo "Deploy fallito. Verifica i log sopra."
